name: Deploy or Teardown Azure Environment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose whether to deploy or teardown infrastructure"
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - teardown
      confirm_teardown:
        description: "Type DESTROY to confirm teardown (required only for teardown)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: feedback-analysis-deployment
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy_or_teardown:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: true
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate teardown confirmation
        if: ${{ github.event.inputs.operation == 'teardown' }}
        run: |
          if [[ "${{ github.event.inputs.confirm_teardown }}" != "DESTROY" ]]; then
            echo "Teardown requires confirm_teardown=DESTROY"
            exit 1
          fi

      - name: Create terraform.tfvars
        run: |
          if [[ -n "${{ secrets.TERRAFORM_TFVARS }}" ]]; then
            printf "%s\n" "${{ secrets.TERRAFORM_TFVARS }}" > terraform.tfvars
          else
            cp terraform.tfvars.example terraform.tfvars
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Import existing resource group into Terraform state
        if: ${{ github.event.inputs.operation == 'deploy' }}
        run: |
          RESOURCE_GROUP_NAME="$(
            awk -F= '/^\s*resource_group_name\s*=/{
              value=$2
              sub(/#.*/, "", value)
              gsub(/^[ \t"]+|[ \t"]+$/, "", value)
              print value
              exit
            }' terraform.tfvars
          )"
          RESOURCE_GROUP_NAME="${RESOURCE_GROUP_NAME:-feedback-analysis-rg}"
          STATE_LIST_FILE="$(mktemp)"
          STATE_LIST_ERROR_FILE="$(mktemp)"
          AZ_GROUP_ERROR_FILE="$(mktemp)"
          trap 'rm -f "${STATE_LIST_FILE}" "${STATE_LIST_ERROR_FILE}" "${AZ_GROUP_ERROR_FILE}"' EXIT

          if RESOURCE_GROUP_ID="$(az group show --name "${RESOURCE_GROUP_NAME}" --query id -o tsv 2>"${AZ_GROUP_ERROR_FILE}")"; then
            :
          elif grep -qi "ResourceGroupNotFound" "${AZ_GROUP_ERROR_FILE}"; then
            RESOURCE_GROUP_ID=""
          else
            echo "Failed to query Azure resource group ${RESOURCE_GROUP_NAME}. Error output:"
            cat "${AZ_GROUP_ERROR_FILE}"
            exit 1
          fi

          if find . -maxdepth 1 -name 'terraform.tfstate*' -print -quit | grep -q .; then
            if ! terraform state list >"${STATE_LIST_FILE}" 2>"${STATE_LIST_ERROR_FILE}"; then
              echo "Unable to read Terraform state before import check. Error output:"
              cat "${STATE_LIST_ERROR_FILE}"
              exit 1
            fi
          else
            touch "${STATE_LIST_FILE}"
          fi

          if [[ -n "${RESOURCE_GROUP_ID}" ]] && ! grep -Eq '(^|[[:space:]])azurerm_resource_group\.this([[:space:]]|$)' "${STATE_LIST_FILE}"; then
            terraform import -input=false azurerm_resource_group.this "${RESOURCE_GROUP_ID}"
          fi

      - name: Terraform apply
        if: ${{ github.event.inputs.operation == 'deploy' }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Deploy app code to Azure Web App
        if: ${{ github.event.inputs.operation == 'deploy' }}
        run: |
          APP_NAME="$(terraform output -raw app_name)"
          RESOURCE_GROUP_NAME="$(terraform output -raw resource_group_name)"
          cd "${GITHUB_WORKSPACE}"
          az webapp up \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP_NAME}" \
            --runtime "PYTHON:3.11"

      - name: Terraform destroy
        if: ${{ github.event.inputs.operation == 'teardown' }}
        run: |
          terraform plan -destroy -input=false -out=tfdestroyplan
          terraform apply -input=false -auto-approve tfdestroyplan
